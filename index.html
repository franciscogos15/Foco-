    // document mints the blobs for its OWN frames, obtaining page text

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains

      // as real-vs-'null' rather than matching.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    }

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-on-click=\"{{ exportData }}\" style=\"min-height:48px; padding:0 14px; justify-content:space-between;\">\n            <span>Exportar<\u002Fspan>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M12 15V3\"><\u002Fpath><path d=\"M21 15v6H3v-6\"><\u002Fpath><path d=\"m7 10 5 5 5-5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <label class=\"btn btn-secondary\" style=\"position:relative; min-height:48px; padding:0 14px; justify-content:space-between;\">\n            <span>Importar<\u002Fspan>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m17 8-5-5-5 5\"><\u002Fpath><path d=\"M21 15v6H3v-6\"><\u002Fpath><\u002Fsvg>\n            <input type=\"file\" accept=\"application/json,.json\" sc-camel-on-change=\"{{ importData }}\" style=\"position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;\">\n          <\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isBarra }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Barra\" style=\"display:flex; flex-direction:column; gap:12px; padding:20px 16px 22px; border-bottom:2px solid var(--color-divider);\">\n        <span style=\"font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700);\">Jornada até a 1ª barra livre<\u002Fspan>\n        <div style=\"display:flex; align-items:flex-end; gap:10px;\">\n          <span style=\"font-family:var(--font-heading); font-weight:800; font-size:104px; line-height:0.76; letter-spacing:-0.05em; color:var(--color-accent);\">{{ barra.numBig }}<\u002Fspan>\n          <span style=\"font-size:14px; font-weight:800; color:var(--color-neutral-700);\">de 6<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"margin:0; font-size:34px;\">{{ barra.name }}<\u002Fh1>\n        <p style=\"margin:0; font-size:15px; line-height:1.45; text-wrap:pretty;\">{{ barra.how }}<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:6px;\">\n          <div style=\"position:relative; height:14px; background:var(--color-neutral-300);\">\n            <div style=\"position:absolute; top:0; bottom:0; left:0; width:{{ barra.pct }}; background:var(--color-accent);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-size:13px;\">\n            <span style=\"font-weight:800;\">{{ barra.bestLabel }}<\u002Fspan>\n            <span style=\"color:var(--color-neutral-700);\">{{ barra.targetLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.45; color:var(--color-neutral-700);\">Aparece em todo treino: no começo do C, no fim do A e do B. Bateu a meta em todas as séries, a etapa avança sozinha.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"border-bottom:2px solid var(--color-divider);\">\n        <sc-for list=\"{{ barra.stages }}\" as=\"sg\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:12px; align-items:start; padding:14px 16px; border-bottom:1px solid var(--color-neutral-300);\">\n            <span style=\"width:40px; height:40px; display:grid; place-items:center; border:2px solid {{ sg.bd }}; background:{{ sg.bg }}; color:{{ sg.fg }}; font-family:var(--font-heading); font-weight:800; font-size:17px;\">{{ sg.mark }}<\u002Fspan>\n            <div style=\"display:flex; flex-direction:column; gap:2px; min-width:0;\">\n              <span style=\"font-weight:800; font-size:16px; color:{{ sg.nameColor }};\">{{ sg.n }}<\u002Fspan>\n              <span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ sg.target }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"padding-top:4px; font-size:12px; font-weight:600; color:var(--color-neutral-700);\">{{ sg.status }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <section style=\"padding:20px 16px 12px;\">\n        <h2 style=\"margin:0; font-size:24px;\">Registros<\u002Fh2>\n      <\u002Fsection>\n      <sc-if value=\"{{ barra.logEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0; padding:0 16px 20px; font-size:14px; line-height:1.45; color:var(--color-neutral-700);\">Ainda nada. A primeira série entra no próximo treino.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ barra.log }}\" as=\"l\" hint-placeholder-count=\"2\">\n        <div style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 16px; border-top:1px solid var(--color-neutral-300);\">\n          <div style=\"display:flex; flex-direction:column; min-width:0;\">\n            <span style=\"font-weight:800; font-size:15px;\">{{ l.date }}<\u002Fspan>\n            <span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ l.stage }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-family:var(--font-heading); font-weight:800; font-size:15px;\">{{ l.vals }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <section style=\"display:flex; flex-wrap:wrap; gap:8px; padding:20px 16px 28px; border-top:2px solid var(--color-divider);\">\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ barraBack }}\" disabled=\"{{ barra.cantBack }}\" style=\"min-height:44px; padding:0 14px;\">Voltar etapa<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ barraSkip }}\" disabled=\"{{ barra.cantSkip }}\" style=\"min-height:44px; padding:0 14px;\">Marcar etapa como feita<\u002Fbutton>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isFotos }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Fotos\" style=\"display:flex; flex-direction:column; gap:12px; padding:20px 16px 18px; border-bottom:2px solid var(--color-divider);\">\n        <h1 style=\"margin:0; font-size:36px;\">Fotos<\u002Fh1>\n        <p style=\"margin:0; font-size:14px; line-height:1.45; color:var(--color-neutral-700); text-wrap:pretty;\">A cada 2 semanas: mesma luz, mesmo lugar, mesma pose — frente, lado e costas.<\u002Fp>\n        <label class=\"btn btn-primary\" style=\"position:relative; min-height:52px; padding:0 16px; justify-content:space-between; font-size:16px; cursor:pointer;\">\n          <span>{{ fotos.addLabel }}<\u002Fspan>\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M14.5 4h-5L7 7H2v13h20V7h-5z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onPhotoFile }}\" style=\"position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;\">\n        <\u002Flabel>\n      <\u002Fsection>\n\n      <sc-if value=\"{{ fotos.hasCompare }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"border-bottom:2px solid var(--color-divider);\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:16px 16px 10px;\">\n            <span style=\"font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase;\">Dia 1 vs. agora<\u002Fspan>\n            <span style=\"font-size:13px; color:var(--color-neutral-700);\">{{ fotos.compareDays }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2px; background:var(--color-divider); border-top:2px solid var(--color-divider);\">\n            <sc-for list=\"{{ fotos.pair }}\" as=\"fp\" hint-placeholder-count=\"2\">\n              <figure style=\"margin:0; background:var(--color-bg);\">\n                <img class=\"grayscale\" src=\"{{ fp.src }}\" alt=\"{{ fp.alt }}\" style=\"display:block; width:100%; aspect-ratio:3/4; object-fit:cover;\">\n                <figcaption style=\"margin:0; padding:8px 12px; font-size:12px; color:var(--color-neutral-700);\">{{ fp.date }}<\u002Ffigcaption>\n              <\u002Ffigure>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ fotos.empty }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:16px; align-items:end; padding:20px 16px; border-bottom:2px solid var(--color-divider);\">\n          <div style=\"aspect-ratio:3/4; display:flex; align-items:flex-end; padding:10px; background:var(--color-surface); font-size:12px; font-weight:800; color:var(--color-neutral-700);\">Dia 1<\u002Fdiv>\n          <p style=\"margin:0; font-size:14px; line-height:1.45; text-wrap:pretty;\">Tira a primeira hoje. Daqui 8 semanas você vai querer comparar.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ fotos.hasGrid }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"border-bottom:2px solid var(--color-divider);\">\n          <div style=\"padding:16px 16px 10px;\">\n            <span style=\"font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase;\">Todas<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2px; background:var(--color-divider); border-top:2px solid var(--color-divider);\">\n            <sc-for list=\"{{ fotos.grid }}\" as=\"ph\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ ph.open }}\" style=\"display:flex; flex-direction:column; padding:0; border:0; background:var(--color-bg); text-align:left; cursor:pointer;\">\n                <img class=\"grayscale\" src=\"{{ ph.src }}\" alt=\"\" style=\"display:block; width:100%; aspect-ratio:3/4; object-fit:cover;\">\n                <span style=\"padding:6px 8px; font-size:11px; color:var(--color-neutral-700);\">{{ ph.date }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <section style=\"padding-bottom:24px;\">\n        <div style=\"display:flex; flex-direction:column; gap:4px; padding:20px 16px 12px;\">\n          <span style=\"font-size:11px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-accent-700);\">Referências<\u002Fspan>\n          <h2 style=\"margin:0; font-size:26px;\">O shape que você tá construindo<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2px; background:var(--color-divider); border-top:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider);\">\n          <sc-for list=\"{{ inspo }}\" as=\"im\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ im.open }}\" style=\"display:block; padding:0; border:0; background:var(--color-bg); cursor:pointer;\">\n              <img class=\"grayscale\" src=\"{{ im.src }}\" alt=\"Referência de shape\" style=\"display:block; width:100%; aspect-ratio:3/4; object-fit:cover; object-position:{{ im.pos }};\">\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <nav style=\"position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:30; background:var(--color-bg); border-top:2px solid var(--color-divider); padding-bottom:env(safe-area-inset-bottom);\">\n    <div style=\"display:grid; grid-template-columns:repeat(5,minmax(0,1fr));\">\n      <button sc-camel-on-click=\"{{ go.hoje }}\" style=\"height:60px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:5px; padding:0 0 0 12px; border:0; background:transparent; color:{{ tc.hoje }}; box-shadow:{{ tb.hoje }}; font-family:var(--font-body); cursor:pointer;\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"M8 2v4\"><\u002Fpath><path d=\"M16 2v4\"><\u002Fpath><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase;\">Hoje<\u002Fspan>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ go.treino }}\" style=\"height:60px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:5px; padding:0 0 0 12px; border:0; background:transparent; color:{{ tc.treino }}; box-shadow:{{ tb.treino }}; font-family:var(--font-body); cursor:pointer;\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><path d=\"m6.5 6.5 11 11\"><\u002Fpath><path d=\"m21 21-1-1\"><\u002Fpath><path d=\"m3 3 1 1\"><\u002Fpath><path d=\"m18 22 4-4\"><\u002Fpath><path d=\"m2 6 4-4\"><\u002Fpath><path d=\"m3 10 7-7\"><\u002Fpath><path d=\"m14 21 7-7\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size:11px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase;\">Treino<\u002Fspan>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ go.evolucao }}\" style=\"height:60px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:5px; padding:0 0 0 12px; border:0; background:transparent; color:{{ tc.evolucao }}; box-shadow:{{ tb.evolucao }}
